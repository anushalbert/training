# Render Blueprint — deploys backend (Docker web service) + frontend (static site).
# Database is NOT included here: use a free Supabase Postgres project instead
# (see DEPLOY.md) so your data isn't tied to Render's free-tier Postgres expiry.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# New -> Blueprint and point it at the repo. Render reads this file and
# creates both services below automatically.

services:
  - type: web
    name: training-platform-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually: Supabase connection string, see DEPLOY.md
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret for you
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false          # set manually: your frontend's Render URL, see DEPLOY.md

  - type: web
    name: training-platform-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set manually: your backend's Render URL + /api, see DEPLOY.md
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
